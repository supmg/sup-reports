<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buns From Home &mdash; Sup Signal Report cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 800px; height: 1200px;
    overflow: hidden; background: transparent;
    font-family: 'Geist Mono', monospace;
  }

  .cover {
    width: 800px; height: 1200px;
    background: linear-gradient(170deg, #EDD9D2 0%, #DECBC5 100%);
    color: #2C1612;
    position: relative; overflow: hidden;
    box-sizing: border-box;
  }

  .grain {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.32), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(44,22,18,0.05), transparent 60%);
    pointer-events: none; z-index: 1;
  }

  .frame {
    position: absolute; inset: 36px;
    border: 1px solid rgba(44,22,18,0.20);
    border-radius: 24px;
    z-index: 2; pointer-events: none;
  }

  .content {
    position: absolute; inset: 70px;
    display: flex; flex-direction: column;
    z-index: 3;
  }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Geist Mono', monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    opacity: 0.6;
  }
  .header .brand { display: flex; align-items: center; gap: 8px; }
  .header .wave { font-size: 16px; }

  .wordmark-block {
    margin-top: 140px;
    text-align: center;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 84px;
    line-height: 0.85;
    color: #502828;
    letter-spacing: -0.045em;
    font-variation-settings: "opsz" 144;
  }
  .wordmark .apos {
    font-weight: 500;
    font-size: 0.78em;
    margin-left: -0.04em;
    opacity: 0.85;
  }

  .strap {
    margin-top: 50px;
    text-align: center;
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.62;
  }
  .strap .sep { margin: 0 14px; opacity: 0.45; }

  .ornament {
    margin: 40px auto 30px;
    width: 100px; height: 1px;
    background: currentColor;
    opacity: 0.26;
  }

  .deck {
    text-align: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 25px;
    line-height: 1.4;
    max-width: 560px;
    margin: 0 auto;
    opacity: 0.88;
    font-variation-settings: "opsz" 48;
  }
  .deck .num {
    font-weight: 700;
    font-style: normal;
    opacity: 1;
  }

  .evidence {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 0 16px;
  }
  .evidence svg {
    width: 360px;
    height: auto;
    opacity: 0.55;
  }

  .bottom-rule {
    height: 1px;
    background: currentColor;
    opacity: 0.18;
    margin-top: 8px;
  }
  .footer {
    margin-top: 20px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Geist Mono', monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    opacity: 0.7;
  }
  .footer .center { opacity: 0.55; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grain"></div>
    <div class="frame"></div>
    <div class="content">

      <div class="header">
        <span class="brand"><span class="wave">&#128075;</span><span>Sup &mdash; Signals</span></span>
        <span>No. 03 / 2026</span>
      </div>

      <div class="wordmark-block">
        <div class="wordmark">Buns From Home</div>
      </div>

      <div class="strap">Bakery<span class="sep">·</span>London<span class="sep">·</span>Feb 15 – Mar 11, 2026</div>

      <div class="ornament"></div>

      <div class="deck">A social deep-dive into the <span class="num">664</span> cafés, coffee shops and bakeries shaping London — and where Buns From Home really sits inside it.</div>

      <div class="evidence"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 180' fill='none'><g stroke='#2C1612' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><ellipse cx='180' cy='140' rx='150' ry='7' fill='#2C1612' opacity='0.10' stroke='none'/><path d='M 32 132 C 38 60, 115 30, 180 30 C 245 30, 322 60, 328 132 Z' opacity='0.85'/><path d='M 32 132 Q 180 154, 328 132' opacity='0.85'/><path d='M 100 55 Q 130 46, 168 44' opacity='0.7'/><path d='M 110 78 Q 150 67, 200 64' opacity='0.7'/><path d='M 130 100 Q 180 88, 230 88' opacity='0.7'/></g><g fill='#2C1612' opacity='0.45'><circle cx='50' cy='150' r='1.4'/><circle cx='68' cy='154' r='1'/><circle cx='86' cy='152' r='0.9'/><circle cx='278' cy='153' r='1.1'/><circle cx='296' cy='150' r='0.9'/><circle cx='312' cy='154' r='1.0'/></g></svg></div>

      <div class="bottom-rule"></div>
      <div class="footer">
        <span>Vol. 03</span>
        <span class="center">Social Deep Dive</span>
        <span>sup.co/reports</span>
      </div>

    </div>
  </div>
</body>
</html>
