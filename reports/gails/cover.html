<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAIL&#x27;s Bakery — Signal Report cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 1200px;
    overflow: hidden;
    background: transparent;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .cover {
    width: 800px;
    height: 1200px;
    background: #CF2030;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px;
    box-sizing: border-box;
  }

  .pattern {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27180%27%20height=%27180%27%20viewBox=%270%200%20180%20180%27%3E%3Cg%20fill=%27none%27%20stroke=%27%23F5F5ED%27%20stroke-width=%271.6%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%20opacity=%270.18%27%3E%3Cpath%20d=%27M30%2090%20C%2028%2056,%2064%2036,%2096%2044%20C%20120%2050,%20130%2066,%20122%2080%20C%20116%2090,%20100%2090,%2092%2080%20C%2086%2072,%2090%2062,%2098%2060%20C%20106%2058,%20114%2064,%20112%2072%27%20transform=%27rotate(-15%2070%2070)%27/%3E%3C/g%3E%3C/svg%3E");
    background-size: 180px 180px;
    background-repeat: repeat;
    pointer-events: none;
  }

  .feature {
    position: absolute;
    right: -160px;
    bottom: -160px;
    width: 720px;
    height: 720px;
    pointer-events: none;
    opacity: 0.34;
    transform: rotate(-22deg);
  }
  .feature svg { width: 100%; height: 100%; }

  .glow {
    position: absolute;
    top: -260px;
    left: -200px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 60%);
    pointer-events: none;
  }

  .top {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .sup-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .sup-mark .wave { font-size: 22px; }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 11px;
    font-weight: 600;
    opacity: 0.82;
    text-align: right;
    line-height: 1.6;
  }

  .center {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 11px;
    font-weight: 600;
    opacity: 0.82;
    margin-bottom: 22px;
  }
  .kicker::before {
    content: '';
    width: 28px;
    height: 1px;
    background: currentColor;
    opacity: 0.7;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 220px;
    line-height: 0.9;
    letter-spacing: -0.04em;
    font-style: italic;
  }
  .wordmark .apostrophe {
    color: rgba(255,255,255,0.55);
  }
  .wordmark-sub {
    margin-top: 20px;
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 28px;
    letter-spacing: -0.01em;
    opacity: 0.78;
  }

  .bottom {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .divider {
    height: 1px;
    background: currentColor;
    opacity: 0.25;
    width: 100%;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand-logo {
    width: 64px;
    height: 64px;
    background: #FFFFFF;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .brand-logo img {
    max-width: 72%;
    max-height: 72%;
    object-fit: contain;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-name {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-meta {
    font-size: 14px;
    opacity: 0.82;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="pattern"></div>
    <div class="glow"></div>
    <div class="feature">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><g fill='none' stroke='#F5F5ED' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'><path d='M30 110 C 26 60, 78 28, 130 40 C 168 48, 184 78, 172 100 C 160 120, 130 122, 116 108 C 104 96, 110 80, 122 78 C 134 76, 146 86, 142 100'/><path d='M52 96 C 56 84, 70 76, 90 80' opacity='0.6'/><path d='M62 110 C 66 100, 80 96, 100 100' opacity='0.6'/><path d='M78 124 C 82 116, 96 112, 116 116' opacity='0.6'/></g></svg>
    </div>

    <div class="top">
      <div class="sup-mark">
        <span class="wave">&#128075;</span>
        <span>Sup</span>
      </div>
      <div class="eyebrow">Signal Report<br>April 2026</div>
    </div>

    <div class="center">
      <div class="kicker">The fashion backdrop edition</div>
      <div class="wordmark">GAIL<span class="apostrophe">’</span>s</div>
      <div class="wordmark-sub">London bakery · Vol. 01</div>
    </div>

    <div class="bottom">
      <div class="divider"></div>
      <div class="brand-row">
        <div class="brand-logo">
          <img src="logo.png" alt="GAIL&#x27;s Bakery">
        </div>
        <div class="brand-text">
          <div class="brand-name">GAIL&#x27;s Bakery</div>
          <div class="brand-meta">F&amp;B · Bakeries · London</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
